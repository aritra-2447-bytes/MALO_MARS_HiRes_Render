name: Validate Promotion Path

on:
  pull_request:
    branches:
      - official/dev
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-promotion:
    name: validate-promotion
    runs-on: ubuntu-latest

    steps:
      - name: Validate promotion path
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Target base branch: $BASE_BRANCH"
          echo "Source head branch: $HEAD_BRANCH"

          if [[ "$BASE_BRANCH" != "official/dev" ]]; then
            echo "::error::Invalid target branch: '$BASE_BRANCH'. This workflow only validates promotions into 'official/dev'."
            exit 1
          fi

          if [[ "$HEAD_BRANCH" != "official/preview" ]]; then
            echo "::error::Promotion rejected. Pull requests targeting 'official/dev' are strictly restricted to come from 'official/preview'. Received: '$HEAD_BRANCH'."
            exit 1
          fi

          echo "Promotion path successfully validated: '$HEAD_BRANCH' -> '$BASE_BRANCH'."
